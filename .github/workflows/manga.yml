name: Manga bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "manga-bot"
          git config user.email "manga-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "maj" && git push)
